name: deploy-cloudflare-preview

on:
  push:
    branches:
      - "codex/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-shared-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run preflight

      - name: Deploy preview to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name anyworkflow-remote-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish preview URL
        if: always() && steps.deploy.outputs.deployment-url != ''
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### AnyWorkflow Remote preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
